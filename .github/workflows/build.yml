name: Build DH-VulkanMod 1.21.10

on:
  workflow_dispatch:
  push:
    branches:
      - dev-v2.4.6+vm.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download Dependency JARs
        run: |
          mkdir -p jars
          curl -s -L -o "jars/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar" \
            "https://cdn.modrinth.com/data/uCdwusMi/versions/CKJFSOC6/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar"
          curl -s -L -o "jars/VulkanMod_1.21.10-0.6.1.jar" \
            "https://cdn.modrinth.com/data/JYQhtZtO/versions/7kz8u8GF/VulkanMod_1.21.10-0.6.1.jar"

      - name: Build Mod with Gradle
        run: ./gradlew :vulkan:remapJar -PmcVer="1.21.10" --no-daemon --stacktrace

      - name: Upload Built Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DistantHorizons-VulkanMod-1.21.10
          path: vulkan/build/libs/*.jar
