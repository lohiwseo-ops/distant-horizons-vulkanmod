name: Build DH-VulkanMod 1.21.10
on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft Version'
        required: true
        default: '1.21.10'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Download Dependency JARs
        run: |
          mkdir -p jars
          curl -s -L -o "jars/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar" \
            "https://cdn.modrinth.com/data/uCdwusMi/versions/CKJFSOC6/DistantHorizons-2.4.5-b-1.21.10-fabric-neoforge.jar"
          curl -s -L -o "jars/VulkanMod_1.21.10-0.6.6.jar" \
            "https://cdn.modrinth.com/data/JYQhtZtO/versions/jkDMvvWU/VulkanMod_1.21.10-0.6.6.jar"
      - name: Build Mod with Gradle
        run: ./gradlew :vulkan:remapJar -PmcVer="${{ github.event.inputs.mc_version }}" --stacktrace
      - name: Upload Built Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DistantHorizons-VulkanMod-1.21.10
          path: vulkan/build/libs/*.jar
